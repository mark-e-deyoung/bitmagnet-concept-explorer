name: IOC upstream Bitmagnet compatibility
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/real-bitmagnet-feedback-fast-lane.sh"
      - ".github/workflows/ioc-bitmagnet-compat.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        bitmagnet: [v0.10.0, v0.10.1]
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      GOFLAGS: "-mod=readonly"
      BCE_RDTE_BITMAGNET_VERSION: ${{ matrix.bitmagnet }}
      BCE_RDTE_AUTHENTIC_PUBLISHER: "0"
      BCE_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.1"
          cache: false
      - name: Qualify isolated read-only application compatibility
        run: |
          bash -n .github/scripts/real-bitmagnet-feedback-fast-lane.sh
          bash .github/scripts/real-bitmagnet-feedback-fast-lane.sh
