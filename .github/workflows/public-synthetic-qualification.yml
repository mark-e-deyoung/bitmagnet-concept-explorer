name: Public source-only synthetic qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-synthetic-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOPROXY: "off"
  GOSUMDB: "off"
  GOFLAGS: "-mod=readonly"
  BCE_LOCAL_BITMAGNET_HIL: "0"

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Confirm runner and source
        run: |
          go version
          node --version
          git rev-parse HEAD
      - name: Offline Go unit and race-independent tests
        run: go test -count=1 ./...
      - name: Vet and source-format contract
        run: |
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Embedded browser state regression
        run: node web/query_state.test.mjs
      - name: Evidence workbench semantic and design-system contract
        run: node web/ux_contract.test.mjs

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Offline Go race qualification
        run: go test -count=1 -race ./...

  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Build standalone service and automation client
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -o /tmp/bce-service .
          go build -trimpath -o /tmp/bce-client ./cmd/bce
          file /tmp/bce-service /tmp/bce-client

  browser-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install reviewed browser test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for real interaction and axe tests
        run: npx playwright install --with-deps chromium
      - name: Run two-viewport browser journeys, theme, axe and screenshot QA
        env:
          CI: "1"
        run: npm run ux:test
      - name: Retain browser screenshot/traces and test HTML evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-workbench-browser-qa-${{ github.run_id }}
          path: |
            build/playwright-report
            build/playwright-results
          if-no-files-found: ignore
          retention-days: 14
