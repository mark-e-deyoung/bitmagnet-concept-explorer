name: Temporary public native gofmt for multilingual feedback workcell

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "feedback_sweep.go"
      - "feedback_sweep_test.go"
      - "feedback_preview.go"
      - ".github/workflows/_sweep_gofmt_rdte.yml"

permissions:
  contents: read

jobs:
  formatted-source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Output native formatter evidence for source-only Go files
        run: |
          for f in feedback_sweep.go feedback_sweep_test.go feedback_preview.go; do
            printf 'FMT_BEGIN:%s\n' "$f"
            gofmt "$f" | base64 -w0
            printf '\nFMT_END:%s\n' "$f"
          done
