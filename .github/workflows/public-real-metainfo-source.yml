name: Public authentic publisher torrent-metainfo qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/public-real-metainfo-source.yml"
      - "cmd/rdte-torrent-collector/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bce-authentic-metainfo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-metainfo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      GOFLAGS: "-mod=readonly"
      BCE_METADATA_ONLY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.1"
          cache: false
      - name: Verify immutable source and offline metainfo parser tests
        env:
          BCE_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BCE_EXPECTED_SOURCE_SHA"
          go test -count=1 ./cmd/rdte-torrent-collector
          go vet ./cmd/rdte-torrent-collector
      - name: Collect original publisher .torrent bytes with bounded HTTPS, no peers or payload
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bce-original-public-metainfo"
          mkdir -p "$out"
          echo "PUBLIC_PUBLISHER_SOURCE: exact_git_head=$(git rev-parse HEAD)"
          # The collector enforces HTTPS origin/redirect allowlist, 30s per URL,
          # <=2MiB torrent, no DHT, no webseed, no swarm, no ISO download.
          # Do not couple independent real publisher bytes to Gutenberg's
          # currently 503/budget-blocked bulk metadata acquisition.
          set +e
          timeout --signal=TERM --kill-after=10s 420s \
            go run ./cmd/rdte-torrent-collector -out "$out" -minimum 5
          rc=$?
          set -e
          if [[ -s "$out/manifest.json" ]]; then
            jq '{schema_version,authority_status,no_payload_download,no_swarm_or_dht,admitted:(.entries|length),
                 by_source:(.entries|group_by(.source)|map({source:.[0].source,count:length})),
                 source_events}' "$out/manifest.json"
          fi
          if [[ "$rc" != 0 ]]; then
            echo "::error::Publisher-source collector exit=$rc; retain first failure and manifest, never substitute invented torrent hashes"
            exit 1
          fi
          jq -e '
            .schema_version=="cpe-rdte-real-metainfo-v1" and
            .authority_status=="research_source_observations_not_accepted_CPE" and
            .no_payload_download==true and .no_swarm_or_dht==true and
            ([.entries[] | select(.source=="ubuntu:official")]|length)>=1 and
            ([.entries[] | select(.source=="debian:official-mirror")]|length)==1 and
            ([.entries[] | select(.source=="arch:official")]|length)==1 and
            ([.entries[] | select(.source=="fedora:official")]|length)==1 and
            all(.entries[]; .rights_status=="source_claim_not_independently_qualified" and
               .p2p_used==false and .payload_downloaded==false and
               (.metainfo_sha256|test("^[0-9a-f]{64}$")) and
               (.infohash|test("^[0-9a-f]{40}$")))
          ' "$out/manifest.json" >/dev/null
          echo "PUBLISHER_REAL_METAINFO_PASS: original pinned source identities, rights unadjudicated"
      - name: Preserve source-event receipt and original metainfo for bounded independent replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-publisher-metainfo-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bce-original-public-metainfo/manifest.json
            ${{ runner.temp }}/bce-original-public-metainfo/metainfo/
          if-no-files-found: ignore
          retention-days: 14
