name: Public real Bitmagnet ephemeral system rep

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # This 25-minute authentic publisher/Gutenberg lane is currently gated:
    # a pinned v0.10.0 public run imported its first 5 rows and then hit
    # an external HTTP 503 / hard cap. Do not re-launch it on every unrelated
    # Go/CLI/UI PR. The shorter actual Bitmagnet feedback lane qualifies the
    # product seam independently; this lane is for corpus fixture/harness
    # changes or explicit operators, plus main's scheduled deep rep.
    paths:
      - ".github/scripts/real-bitmagnet-ephemeral-rep.sh"
      - ".github/scripts/sample-public-gutenberg-catalog.py"
      - ".github/workflows/real-bitmagnet-ephemeral.yml"
      - "fixtures/public-bitmagnet-rep.ndjson"
  workflow_dispatch:
  # Scheduled only AFTER this draft is independently accepted onto main.
  # A schedule in an open PR branch is not active on GitHub.
  schedule:
    - cron: '43 4 * * 2,5'

permissions:
  contents: read

concurrency:
  group: public-real-bitmagnet-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOPROXY: "off"
  GOSUMDB: "off"
  GOFLAGS: "-mod=readonly"
  BCE_LOCAL_BITMAGNET_HIL: "0"

jobs:
  live-real-stack:
    name: Real PostgreSQL + Bitmagnet v0.10.0 + Explorer + CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable PR head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up fixed Go version
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Validate bounded original-source acquisition harness
        run: bash -n .github/scripts/real-bitmagnet-ephemeral-rep.sh
      - name: Real upstream Bitmagnet and Explorer live isolated integration
        shell: bash
        run: bash .github/scripts/real-bitmagnet-ephemeral-rep.sh
      - name: Preserve authentic public metainfo and source provenance for limited RDTE replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-public-torrent-metadata-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bce-real-bitmagnet-rep/rdte-real-metainfo/
            ${{ runner.temp }}/bce-real-bitmagnet-rep/public-catalog-transport-receipt.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
