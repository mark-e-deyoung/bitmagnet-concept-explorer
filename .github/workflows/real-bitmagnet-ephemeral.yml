name: Public real Bitmagnet ephemeral system rep

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-real-bitmagnet-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOPROXY: "off"
  GOSUMDB: "off"
  GOFLAGS: "-mod=readonly"
  BCE_LOCAL_BITMAGNET_HIL: "0"

jobs:
  live-real-stack:
    name: Real PostgreSQL + Bitmagnet v0.10.0 + Explorer + CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable PR head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up fixed Go version
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Real upstream Bitmagnet and Explorer live isolated integration
        shell: bash
        run: bash .github/scripts/real-bitmagnet-ephemeral-rep.sh
