groups:
  - name: Authentication
    description: Credentials for access to the read-only app. Basic Auth requires TLS for remote access; use a trusted reverse proxy and do not expose plaintext credentials.
  - name: Bitmagnet Integration
    description: Optional read-only Bitmagnet endpoint.
  - name: Network Configuration
    description: Container-only exposure is the default. Host publishing is opt-in and defaults to 127.0.0.1; remote Basic Auth requires TLS termination.
  - name: Resources Configuration
    description: CPU and memory limits.
  - name: Optional Research Data
    description: Read-only digest-pinned local source files, research only. No accepted CPE authority is implied.
  - name: Optional Provider and Research Credentials
    description: Optional server-side read-only TMDb/Jellyfin inputs and local CPE feedback HMAC key. Secrets are for administrator-controlled app environment only; no provider calls are automatic.

questions:
  - variable: explorer
    label: Concept Explorer Settings
    group: Authentication
    schema:
      type: dict
      attrs:
        - variable: auth_user
          label: Login User
          schema:
            type: string
            default: explorer
            required: true
        - variable: auth_password
          label: Login Password
          schema:
            type: string
            private: true
            required: true
            min_length: 16

  - variable: bitmagnet
    label: Bitmagnet Integration
    group: Bitmagnet Integration
    schema:
      type: dict
      attrs:
        - variable: graphql_url
          label: Bitmagnet GraphQL URL
          description: Optional private or loopback IP or localhost URL ending in /graphql. Other DNS names and public addresses are rejected by the app.
          schema:
            type: string
            default: ""
            required: false

  - variable: network
    label: Network Settings
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: Internal Web Service
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Service Exposure
                schema:
                  type: string
                  default: exposed
                  enum:
                    - value: exposed
                      description: Container-only TCP exposure; no host port is published. Use a trusted same-network reverse proxy.
                    - value: published
                      description: Explicit host port binding to selected IPs (defaults to loopback); remote Basic Auth requires a TLS-terminating reverse proxy.
                    - value: ""
                      description: Do not expose the port.
              - variable: port_number
                label: Service Port
                schema:
                  type: int
                  default: 3086
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                schema:
                  type: list
                  default:
                    - 127.0.0.1
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true

  - variable: research_data
    label: Optional Research Data
    group: Optional Research Data
    schema:
      type: dict
      attrs:
        - variable: graph_file
          label: Local research concept graph file
          description: Optional host file, mounted read-only. Must have matching SHA-256. Never an accepted CPE snapshot.
          schema:
            type: string
            default: ""
            required: false
        - variable: graph_sha256
          label: Research graph file SHA-256
          description: Exact 64-hex byte digest of graph file. Blank when graph file is absent.
          schema:
            type: string
            default: ""
            required: false
        - variable: evidence_file
          label: Local public research evidence file
          description: Optional attributed work/art catalog JSON, mounted read-only. Rights entries are source claims.
          schema:
            type: string
            default: ""
            required: false
        - variable: evidence_sha256
          label: Public research evidence SHA-256
          description: Exact 64-hex digest of evidence file; blank when absent.
          schema:
            type: string
            default: ""
            required: false

  - variable: media_lookup
    label: Optional Media Discovery and Feedback
    group: Optional Provider and Research Credentials
    schema:
      type: dict
      attrs:
        - variable: jellyfin_base_url
          label: Local Jellyfin server origin
          description: Optional literal private/loopback IP origin (e.g. http://192.168.1.9:8096). Never expose personal library content outside the trusted network.
          schema:
            type: string
            default: ""
            required: false
        - variable: jellyfin_token
          label: Jellyfin read-only API token
          description: Stored in app environment, admin-visible in TrueNAS deployment details. Scope separately and protect access to app administration.
          schema:
            type: string
            private: true
            default: ""
            required: false
        - variable: tmdb_read_token
          label: TMDb API read token
          description: Optional server-side Bearer read token. The API requires explicit per-query external-lookup consent; live use also requires current TMDb terms/attribution compliance.
          schema:
            type: string
            private: true
            default: ""
            required: false
        - variable: feedback_hmac_key
          label: Local CPE research feedback HMAC key
          description: Optional server-local key of at least 32 bytes for privacy-keyed Bitmagnet observation refs. Do not reuse account passwords or publish real-key-derived refs.
          schema:
            type: string
            private: true
            default: ""
            required: false

  - variable: resources
    label: Resource Limits
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPU Limit
                schema:
                  type: int
                  default: 2
                  min: 1
                  max: 8
              - variable: memory
                label: Memory Limit (MiB)
                schema:
                  type: int
                  default: 1024
                  min: 256
                  max: 8192
